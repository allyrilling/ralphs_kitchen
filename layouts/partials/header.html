<header class="site-header" x-data="{ open: false }">
  <div class="site-wrapper">
    <a href="{{ .Site.BaseURL }}" class="site-title">{{ .Site.Title }}</a>
    <div class="header-right">
      <button
        class="menu-toggle"
        :class="{ 'is-open': open }"
        :aria-expanded="open"
        :aria-label="open ? 'Close menu' : 'Open menu'"
        @click="open = !open"
        aria-controls="site-nav">
        <span class="menu-icon"></span>
      </button>
    </div>
    <nav
      id="site-nav"
      class="site-nav"
      aria-label="Main navigation"
      x-show="open"
      x-cloak
      @click="if ($event.target.tagName === 'A') open = false">
      <ul>
        {{ with site.GetPage "/dinner-party" }}<li><a href="{{ .RelPermalink }}">Dinner Party</a></li>{{ end }}
        {{ with site.GetPage "/out-on-the-town" }}<li><a href="{{ .RelPermalink }}">Out on the Town</a></li>{{ end }}
        {{ with site.GetPage "/search" }}<li><a href="{{ .RelPermalink }}">Search</a></li>{{ end }}
        {{ with site.GetPage "/about" }}<li><a href="{{ .RelPermalink }}">About Ralph</a></li>{{ end }}
      </ul>
    </nav>
  </div>
</header>
