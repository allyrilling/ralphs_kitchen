{{ define "main" }}
<div class="page-header">
  <h1 class="page-title">Search</h1>
</div>

<div class="search-form">
  <label for="search-input" class="visually-hidden">Search posts</label>
  <input
    type="search"
    id="search-input"
    class="search-input"
    placeholder="Search posts…"
    autocomplete="off"
    autofocus
  >
</div>

<div id="search-results" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js" crossorigin="anonymous"></script>
<script>var searchIndexUrl = {{ "/index.json" | absURL | jsonify }};</script>
<script src="{{ "/js/search.js" | relURL }}"></script>
{{ end }}
