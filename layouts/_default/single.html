{{ define "main" }}
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    <div class="post-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
      {{ with .ReadingTime }}<span>{{ . }} min read</span>{{ end }}
      {{ with .Params.location }}<span class="post-location">📍 <em>{{ . }}</em></span>{{ end }}
    </div>
  </header>

  {{ if and .TableOfContents (gt (len .TableOfContents) 100) }}
  <nav class="toc" aria-label="Table of contents">
    <p class="toc-title">Contents</p>
    {{ .TableOfContents }}
  </nav>
  {{ end }}

  <div class="post-content">
    {{ .Content }}
  </div>
</article>

<!-- medium-zoom for image lightbox -->
<script src="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js" integrity="sha256-ZgMyDAIYDYGxbcpJcfUnYwNevG/xi9OHKaR/8GK+asM=" crossorigin="anonymous"></script>
<script>
  mediumZoom('.post-content img', {
    margin: 24,
    background: getComputedStyle(document.documentElement).getPropertyValue('--bg')
  });
</script>
{{ end }}
