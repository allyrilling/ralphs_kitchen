# NOTE: Auth requires a backend proxy.
# Option A: Deploy via Netlify and enable Netlify Identity.
# Option B: Use a GitHub OAuth proxy (e.g. https://github.com/vencax/netlify-cms-github-oauth-provider)
# Then set base_url below to your proxy URL.

backend:
  name: github
  repo: allyrilling/ralphs_kitchen
  branch: main
  # base_url: https://your-oauth-proxy.example.com   # uncomment when auth is configured

media_folder: "content/posts"
public_folder: "/posts"

collections:
  - name: "posts"
    label: "Posts"
    folder: "content/posts"
    create: true
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    fields:
      - { label: "Title",       name: "title",       widget: "string" }
      - { label: "Date",        name: "date",        widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Description", name: "description", widget: "string",   required: false }
      - { label: "Tags",        name: "tags",        widget: "list",     required: false }
      - { label: "Body",        name: "body",        widget: "markdown" }
