      - { label: "Cover Image", name: "image",       widget: "image",    required: false }
      - label: "Meal Type"
        name: "meal_type"
        widget: "select"
        required: false
        options: ["Breakfast", "Brunch", "Lunch", "Snack", "Dinner", "Dessert", "Other"]
      - label: "Food Genre"
        name: "food_genre"
        widget: "select"
        required: false
        options: ["American", "Cafe", "Italian", "Mexican", "Japanese", "Chinese", "Thai", "Indian", "French", "Mediterranean", "Greek", "Korean", "Vietnamese", "Spanish", "Middle Eastern", "Other"]
      - { label: "Body",        name: "body",        widget: "markdown" }
