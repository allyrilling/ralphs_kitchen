      - { label: "Date",        name: "date",        widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Hide from site", name: "draft", widget: "boolean", default: true, required: false, hint: "When on, this post won't appear on the live site" }
      - { label: "Slug",        name: "slug",        widget: "string",   required: false, hint: "Custom URL slug (leave blank to use title)" }
      - { label: "Location",    name: "location",    widget: "string",   hint: "e.g. Carmelina's, Boston MA" }
      - { label: "City",        name: "city",        widget: "string",   hint: "e.g. Boston, Chicago" }
